syntax = "proto3";
option go_package = "givc/modules/api/exec";
package exec;

// Request to query system uptime
message UptimeRequest {}

// Structured response for system uptime
message UptimeResponse {
    double uptime_seconds = 1;
    double idle_seconds = 2;
    string formatted = 3;
}

// Allowed OTA action types
enum OtaAction {
    OTA_ACTION_UNSPECIFIED = 0;
    OTA_ACTION_GET = 1;
    OTA_ACTION_CACHIX = 2;
}

// Request to execute a dedicated OTA update operation
message OtaUpdateRequest {
    OtaAction action = 1;
    optional string pin = 2;
    optional string cache = 3;
    optional string token = 4;
    optional string cachix_host = 5;
}

// Response for an OTA update operation
message OtaUpdateResponse {
    int32 return_code = 1;
    string output = 2;
    string error = 3;
}

// Dedicated, strongly typed service replacing generic shell/command execution
service Exec {
    // Dedicated RPC for retrieving system uptime without process spawning
    rpc GetUptime(UptimeRequest) returns (UptimeResponse);

    // Dedicated RPC for executing typed OTA updates
    rpc RunOtaUpdate(OtaUpdateRequest) returns (OtaUpdateResponse);
}
